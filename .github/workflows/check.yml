name: Check for new flats

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Otodom and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check.js
      - name: Save state
        if: always()
        run: |
          git config user.name "flat-alert"
          git config user.email "flat-alert@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen listings" && git push)
